<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진경이의 생일 파티 초대장</title>
<style>
:root{
  --wine:#2d0806; --night:#07070a; --wish:#ffffff; --flame:#ffb347; --flame-core:#fff3c4;
  --wax:#f4e9dc; --stripe:#e9798c;
  --day:#fff4e0; --ink:#3b2418; --accent:#d6456b; --card:#ffffff; --muted:#7a5a48;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --day:#ffeccc; --card:#fffaf2; }
}
:root[data-theme="dark"]{ --day:#ffeccc; --card:#fffaf2; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--night); color:var(--wish);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  overflow:hidden; transition:background 1.6s ease, color 1.6s ease;
}
body.lit{background:var(--day); color:var(--ink)}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 7vh);gap:44px;transition:opacity .8s ease,padding-top 1.2s ease}
#stage:not(.talk){padding-top:30vh}
#stage.talk .candle{pointer-events:none}
body.lit #stage{opacity:0;pointer-events:none}
.hint{font-size:13px;line-height:1.7;text-align:center;color:var(--wish);opacity:0;transition:opacity 1s ease .8s;margin:0;padding:0 28px;max-width:320px;word-break:keep-all}
#stage:not(.talk) .hint{opacity:.85}
.glow{position:absolute;width:420px;height:420px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,170,60,.28),rgba(255,170,60,0) 65%);
  top:36px;left:50%;transform:translate(-50%,-50%);animation:pulse 2.4s ease-in-out infinite;transition:opacity .6s}
.out .glow{opacity:0}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.08)}}
.candle{position:relative;width:64px;height:190px;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.candle:focus-visible{outline:2px solid var(--wish);outline-offset:12px;border-radius:8px}
.body{position:absolute;bottom:0;left:16px;width:32px;height:130px;border-radius:6px 6px 3px 3px;
  background:repeating-linear-gradient(-35deg,var(--wax) 0 12px,var(--stripe) 12px 20px);box-shadow:0 0 24px rgba(255,170,60,.18)}
.wick{position:absolute;left:31px;bottom:128px;width:2px;height:12px;background:#2b2b2b}
.flame{position:absolute;left:24px;bottom:136px;width:16px;height:40px;transform-origin:50% 90%;
  background:radial-gradient(ellipse at 50% 75%,var(--flame-core) 0 30%,var(--flame) 62%,rgba(255,120,30,0) 100%);
  border-radius:50% 50% 50% 50%/65% 65% 35% 35%;animation:flick .35s ease-in-out infinite alternate;filter:blur(.4px);
  box-shadow:0 0 22px 8px rgba(255,170,60,.45)}
@keyframes flick{from{transform:rotate(-3deg) scaleY(1)}to{transform:rotate(3deg) scaleY(1.08)}}
.out .flame{animation:none;opacity:0;transition:opacity .15s}
.smoke{position:absolute;left:30px;bottom:140px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);opacity:0}
.out .smoke{animation:smoke 1.6s ease-out forwards}
@keyframes smoke{0%{opacity:.7;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(10px,-90px) scale(9)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
#invite{position:fixed;inset:0;display:block;background:var(--wine);padding:0 0 96px;opacity:0;pointer-events:none;transition:opacity 1.2s ease .6s;overflow-y:auto;-webkit-overflow-scrolling:touch}
body.lit #invite{opacity:1;pointer-events:auto}
.card{--accent:#ff9eb5;--muted:#e0c3b0;color:#fbeedd;border:1px solid rgba(255,225,200,.2);width:calc(100% - 32px);max-width:380px;margin:20px auto 0;text-align:center;background:rgba(255,240,225,.07);border-radius:22px;padding:36px 26px 30px;
  box-shadow:none}
.wrap{width:100%;max-width:440px;margin:0 auto}
.poster{background:var(--wine);padding-top:env(safe-area-inset-top,0px);overflow:hidden}
.pin{position:relative;container-type:inline-size}
.pin::after{content:"";position:absolute;left:0;right:0;bottom:0;height:17%;background:linear-gradient(to bottom,rgba(45,8,6,0),rgba(45,8,6,.6) 55%,var(--wine));pointer-events:none}
.pin img{display:block;width:100%;height:auto}
.by{position:absolute;z-index:2;left:0;right:0;bottom:1.2%;text-align:center;color:#fff;font:500 4.4cqw/1 Georgia,"Noto Serif KR",serif;letter-spacing:.35em;padding-left:.35em}
.emoji{font-size:44px;margin:0 0 6px;line-height:1}
.arch{display:block;width:100%;height:auto;margin:0 0 -4px;overflow:visible}
.arch text{font-size:15px;font-weight:700;fill:var(--accent);font-family:inherit}
h1{font-size:26px;line-height:1.4;margin:0 0 6px;font-weight:800;word-break:keep-all}
.sub{margin:0 0 26px;color:var(--muted);font-size:14px;line-height:1.6;word-break:keep-all}
.msg{margin:0 0 26px;font-size:min(15px,4vw);line-height:1.9;color:#f1dcc9}
.msg p{margin:0 0 18px}
.msg span{display:block;white-space:nowrap}
.msg .end{margin:22px 0 0;color:var(--accent);font-weight:700;font-size:15px}
dl{margin:0;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:14px 16px;font-size:15px;line-height:1.55}
dt{font-weight:700;color:var(--accent)}
dd{margin:0}
.addr{display:block;color:var(--muted);font-size:13px}
.mapimg{display:block;width:100%;height:auto;margin:24px 0 0;border:1px solid rgba(255,225,200,.2);border-radius:16px}
.map{display:inline-block;margin-top:26px;padding:12px 22px;border-radius:999px;background:var(--accent);color:#3a0f10;text-decoration:none;font-weight:700;font-size:14px}
.again{display:block;margin:18px auto 0;background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline}
.mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:10;min-width:40px;height:40px;padding:0 14px;border-radius:999px;border:0;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:13px;cursor:pointer;transition:background .8s ease,color .8s ease}
body.lit .mute{background:rgba(255,255,255,.85);color:#3a0f10;font-size:18px;padding:0}
.cheer{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:9;padding:14px 28px;border:0;border-radius:999px;background:linear-gradient(135deg,#ff9eb5,#ffc46b);color:#3a0f10;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 6px 22px rgba(255,150,120,.4);opacity:0;pointer-events:none;transition:opacity 1s ease 2s,transform .12s ease}
body.lit .cheer{opacity:1;pointer-events:auto}
.cheer:active{transform:translateX(-50%) scale(.93)}
.fl{position:fixed;z-index:20;pointer-events:none;will-change:transform,opacity;animation:rise var(--d,2.4s) ease-out forwards}
@keyframes rise{0%{transform:translate(0,0) scale(.4);opacity:0}10%{opacity:1;transform:translate(0,-6vh) scale(1.15)}30%{transform:translate(var(--x1),-26vh) scale(1)}65%{transform:translate(var(--x2),-55vh) scale(1)}100%{transform:translate(var(--x3),-85vh) scale(.85);opacity:0}}
.cap{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);width:min(320px,86vw);margin:0;text-align:center;font-size:14px;line-height:1.7;color:#fff;opacity:0;transition:opacity .6s ease;word-break:keep-all;text-shadow:0 0 12px rgba(255,200,120,.35)}
.cap.on{opacity:.92}
.vn{position:absolute;inset:0;z-index:3;cursor:pointer;transition:opacity .8s ease;-webkit-tap-highlight-color:transparent}
.vn.end{opacity:0;pointer-events:none}
.gw{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 118px);width:min(230px,60vw);transform:translateX(-50%) scale(.55);transform-origin:50% 100%;filter:brightness(.55);opacity:.8;transition:transform 1.9s cubic-bezier(.3,.7,.2,1),filter 1.9s ease,opacity 1.9s ease}
.gw.near{transform:translateX(-50%) scale(1.1);filter:none;opacity:1}
.gp{display:block;width:100%;height:auto;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-4px)}}
.ch{position:absolute;right:6px;top:-54px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ch button{border:0;border-radius:999px;padding:10px 16px;background:linear-gradient(135deg,#ff9eb5,#ffc46b);color:#3a0f10;font:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(255,150,120,.35);animation:chin .35s ease-out both}
@keyframes chin{from{opacity:0;transform:translateY(8px)}}
.box.ask .nx{opacity:0!important;animation:none!important}
.eye{transform-box:fill-box;transform-origin:center;animation:blink2 4.2s infinite}
@keyframes blink2{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.box{position:absolute;left:14px;right:14px;max-width:420px;margin:0 auto;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);min-height:116px;padding:24px 18px 20px;border-radius:16px;background:rgba(22,12,10,.88);border:1px solid rgba(255,225,200,.35);color:#fff;z-index:2}
.nm{position:absolute;top:-14px;left:16px;padding:4px 14px;border-radius:999px;background:#7a1f2b;color:#fff;font-size:12px;font-weight:700}
.box p{margin:0;font-size:15px;line-height:1.7;word-break:keep-all}
.nx{position:absolute;right:14px;bottom:8px;font-style:normal;font-size:11px;letter-spacing:.04em;color:#fff;opacity:0}
.box.done .nx{opacity:1;animation:blinkx 1s steps(2) infinite}
@keyframes blinkx{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.flame,.glow{animation:none}}
</style>
</head>

</main>
